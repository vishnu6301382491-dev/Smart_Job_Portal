<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Job Portal</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.9rem; }
    a { color: #60a5fa; text-decoration: none; font-weight: 600; }
  </style>
  <script>
    // Redirect to GitHub Pages gh-pages deployment or client dist
    var targetUrl = window.location.pathname.endsWith("/") ? window.location.pathname + "client/dist/" : window.location.pathname + "/client/dist/";
    if (!window.location.href.includes("client/dist")) {
      window.location.replace(targetUrl);
    }
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h1>Loading Smart Job Portal...</h1>
  <p>If you are not redirected automatically, <a id="redirect-link" href="./client/dist/">click here to enter the portal</a>.</p>
</body>
</html>
